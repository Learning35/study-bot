<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffd23f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Study Bot">
  <title>Study Bot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="static/style.css">
</head>
<body>
  <div class="page">
    <header class="top">
      <h1><span class="logo">🤖</span> Study Bot</h1>
      <span class="stats">
        <span class="pill" title="Right answers in a row">🔥 <b id="streakNum">0</b></span>
        <span class="pill" title="How often you're right">🎯 <b id="pctNum">0%</b></span>
      </span>
      <span class="timer">
        <button id="timerLess" class="pill tap" type="button" aria-label="5 minutes less">&minus;</button>
        <button id="timerBtn" class="pill tap" type="button" title="Start or pause the focus timer"><span id="timerIcon">⏱</span> <span id="clock">25:00</span></button>
        <button id="timerMore" class="pill tap" type="button" aria-label="5 minutes more">+</button>
        <button id="timerReset" class="pill tap" type="button" aria-label="Reset timer">↺</button>
      </span>
    </header>

    <nav class="decks" aria-label="Your decks">
      <label for="deckSelect" class="sr">Pick a deck to be quizzed on</label>
      <select id="deckSelect"></select>
      <button id="manageBtn" class="btn" type="button">⚙️ Manage</button>
      <button id="newDeckBtn" class="btn green" type="button">+ New deck</button>
    </nav>

    <main class="chat-card">
      <div id="log" class="log" aria-live="polite"></div>
    </main>

    <div class="chips">
      <button type="button" class="btn blue" data-cmd="quiz">Quiz me! 🎲</button>
      <button type="button" class="btn" data-cmd="skip">Skip</button>
      <button type="button" class="btn" data-cmd="help">Help ❓</button>
      <button id="clearBtn" type="button" class="btn icon" aria-label="Clear chat" title="Clear chat">🧹<span class="label"> Clear</span></button>
    </div>

    <form id="chatForm" class="composer">
      <label for="chatInput" class="sr">Your answer</label>
      <input id="chatInput" type="text" autocomplete="off" placeholder="Type your answer here...">
      <button class="btn pink" type="submit">Send 🚀</button>
    </form>
  </div>

  <dialog id="deckDialog">
    <form id="deckForm">
      <h2>Make a deck ✨</h2>
      <label for="deckName">Name</label>
      <input id="deckName" type="text" maxlength="40" placeholder="Engineering midterm" required>
      <label for="deckNotes">Your notes: one card per line, like <i>term: meaning</i></label>
      <textarea id="deckNotes" rows="6" placeholder="Stack: last in, first out&#10;Queue: first in, first out" required></textarea>
      <p id="formMsg" class="form-msg" role="status"></p>
      <div class="dialog-row">
        <button id="sampleBtn" class="btn" type="button">Try a sample</button>
        <span class="spacer"></span>
        <button id="cancelDeck" class="btn" type="button">Cancel</button>
        <button class="btn pink" type="submit">Save</button>
      </div>
    </form>
  </dialog>
  <dialog id="manageDialog">
    <h2 id="manageTitle">Manage deck</h2>
    <p id="manageCount" class="count"></p>
    <label for="moreNotes">Add more cards: one per line, like <i>term: meaning</i></label>
    <textarea id="moreNotes" rows="5" placeholder="Heap: a tree where every parent is bigger than its children"></textarea>
    <p id="manageMsg" class="form-msg" role="status"></p>
    <div id="manageRow" class="dialog-row">
      <button id="deleteDeckBtn" class="btn red" type="button">Delete deck 🗑</button>
      <span class="spacer"></span>
      <button id="closeManage" class="btn" type="button">Close</button>
      <button id="addCardsBtn" class="btn pink" type="button">Add cards</button>
    </div>
    <div id="confirmRow" class="dialog-row" hidden>
      <b>Delete this deck for good?</b>
      <span class="spacer"></span>
      <button id="keepDeck" class="btn" type="button">Keep it</button>
      <button id="confirmDelete" class="btn red" type="button">Yes, delete</button>
    </div>
  </dialog>
  <script src="static/offline-api.js"></script>
  <script src="static/app.js"></script>
</body>
</html>
